# Matrix 8.8 — настройки темы для панели Turing 8.8" (480x1920).
#
# После правки запусти:  ./generate.py
# Скрипт перерисует видео дождя, постер и theme.json.

# ---------------------------------------------------------------------------
# Главное: слово, которое проступает в дожде.
# Оно падает вниз в одной колонке и читается сверху вниз: первая буква выше
# остальных. Буквы слова ярче шума и держатся за головой колонки дольше.
# ---------------------------------------------------------------------------
[word]
# Слова, которые проступают в дожде. Каждое падает в своей колонке и читается
# сверху вниз; номер колонки считается слева направо с нуля (0..14).
list = ["пиздец", "хуй", "не еби мозги"]
columns = [3, 7, 11]
copies = 6               # сколько раз каждое слово попадает на доску за цикл
trail = 30               # шлейф букв слова: длиннее шума, слово читается дольше
scale = 1.2              # буквы слова крупнее клетки и выезжают в соседние колонки

[video]
fps = 20                 # панель играет H.264; вендорское приложение даёт 24
# Цикл самого дождя: за это время каждая колонка возвращается в исходное
# состояние, поэтому файл из целого числа циклов стыкуется без шва.
cycle_seconds = 40
# Длина файла в секундах (кратна циклу). Панель делает короткую паузу там,
# где кончается файл, поэтому файл длиннее = пауза реже.
duration_seconds = 120
# Затухание в чёрное на обоих концах файла: пауза на стыке приходится на
# тёмные кадры и выглядит как моргание, а не как замирание.
fade_seconds = 0.5
crf = 18                 # качество H.264: меньше = лучше и больше файл
preset = "medium"        # скорость кодирования ffmpeg
# Поворот кадров видео для `bezel stream`: 0..3 четверти по часовой стрелке.
# Панель висит вверх ногами относительно своего нативного кадра, и играет поток
# ровно как он есть, поэтому разворот делается в кадре (2 = 180°), а не командой
# rotation: если развернуть и то, и другое, два разворота гасят друг друга и
# дождь снова идёт снизу вверх.
stream_turns = 2

[canvas]
# Родное разрешение панели: покадрово 480x1920, как она и висит (вертикально).
width = 480
height = 1920
orientation = "reverse-portrait"   # то же, что у omarchy-8.8

[grid]
cell_width = 32.0        # шаг сетки символов по горизонтали
cell_height = 32.0       # шаг по вертикали
font_size = 30           # размер глифа внутри клетки
# Ищем шрифт сначала в самой теме, потом рядом (themes/fonts), потом как путь.
font = "fonts/JetBrainsMono-Bold.otf"

[colors]
background = "#000702"   # почти чёрный, чуть зелёного
noise_body = "#12b854"   # тело шумовой колонки
noise_head = "#dfffee"   # голова шумовой колонки
word_body = "#b9ffd8"    # тело колонки со словом: светлее шума
word_head = "#ffffff"    # голова колонки со словом
glow = "#00ff66"         # свечение вокруг головы и букв слова

[rain]
columns = 15             # при 480 px и клетке 32 px их ровно 15
# Символы шума. Слово тоже набрано кириллицей, поэтому оно не выделяется
# алфавитом — только яркостью и свечением.
alphabet = "абвгдежзийклмнопрстуфхцчшщъыьэюяАБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЭЮЯABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789§№∆×÷≠∈∂+-*/\\|<>[]{}=~^!?:;@#$%&"
trail_min = 14           # длина шлейфа за головой, в клетках
trail_max = 30
speed_min = 0.22         # скорость головы, клеток за кадр (20 к/с)
speed_max = 0.45
glow_radius = 7          # размытие свечения в пикселях
glow_strength = 0.55     # яркость свечения, 0..1